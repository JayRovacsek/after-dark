{% component audio(source, width=100, base_url="", page_path="") %}
<div
  style="width: 100%; max-width: {{ width }}%; margin: 0 auto; text-align: center;">

  <audio controls="controls">
    <source type="audio/mp3" src="{{ base_url | safe }}{{ page_path | safe }}{{ source | safe }}">
    </source>
    <source type="audio/ogg" src="{{ base_url | safe }}{{ page_path | safe }}{{ source | safe }}">
    </source>
    <p>Your browser does not support the audio element.</p>
  </audio>

</div>
{% endcomponent audio %}
