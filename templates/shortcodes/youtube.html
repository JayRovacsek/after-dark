{% component youtube(id, width=100, autoplay=false) %}
<div class="responsive-iframe"
  style="width: 100%; max-width: {{ width }}%; margin: 0 auto; text-align: center;">
  <iframe src="https://www.youtube.com/embed/{{ id }}{% if autoplay %}?autoplay=1{% endif %}" webkitallowfullscreen
    mozallowfullscreen allowfullscreen>
  </iframe>
</div>
{% endcomponent youtube %}
