{% component responsive(src, alt="", width=100, height="", caption="") %}
<div
  style="width: 100%; max-width: {{ width }}%; margin: 0 auto; text-align: center;">
  <img src="{{ src | safe }}" alt="{{ alt | safe }}"
    style="max-width: 100%; height: auto;{% if height %} max-height: {{ height }}px; object-fit: contain;{% endif %} display: inline-block;">
  {% if caption %}
  <div style="margin-top: 0.5em;">
    <p style="font-style: italic;">{{ caption | safe }}</p>
  </div>
  {% endif %}
</div>
{% endcomponent responsive %}
